<div class="register-container">
  <div class="register-card">
    <h1>Registrarse</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuario:</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Tu usuario" required />
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Tu email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Tu contraseña" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña:</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirma tu contraseña" required />
      </div>
      <div *ngIf="error" class="error-message">{{ error }}</div>
      <button type="submit" [disabled]="loading" class="btn-primary">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>
    <p class="login-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
  </div>
</div>
